[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-research-lab"
version = "1.0.0"
description = "Local stock research with chronological model evaluation and transparent signals."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "yfinance>=0.2.65,<2",
    "exchange-calendars>=4.5,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]
browser = ["playwright>=1.50"]

[project.scripts]
stocklab = "stocklab.server:main"

[tool.setuptools.package-data]
stocklab = ["index.html"]

[tool.setuptools.packages.find]
include = ["stocklab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
